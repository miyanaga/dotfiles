# プロンプト設定（install.shで ~/.config/starship.toml にリンクされる）
# 設定リファレンス: https://starship.rs/ja-JP/config/
# 変更は保存した瞬間から新しいプロンプトに反映される（再起動不要）

# host:dir $ だけのシンプルな1行プロンプト
format = '$hostname:$directory$character'

add_newline = false   # プロンプト間の空行なし

[hostname]
ssh_only = false               # ローカルでもホスト名を表示
format = '[$hostname]($style)'
style = 'green'

[directory]
truncation_length = 1          # カレントディレクトリ名だけ表示
truncate_to_repo = false       # リポジトリルートまで遡らない
truncation_symbol = ''         # 省略記号（…/）を付けない
format = '[$path]($style)'
style = 'cyan'

[character]
success_symbol = '[ \$](white)'
error_symbol = '[ \$](red)'

# 調整例（コメントを外して使う）:
# [git_branch]                   # gitブランチを右に足す
# symbol = ''
# → format を '$hostname:$directory$git_branch$character' にする
# [cmd_duration]
# min_time = 5000                # 5秒以上かかったコマンドだけ実行時間を表示
